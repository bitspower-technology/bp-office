name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Which part of the suite is affected?
      options:
        - BP Office Docs (docs)
        - BP Office Sheets (sheets)
        - BP Office PDF (pdf)
        - BP Office Markdown (markdown)
        - BP Office shell / home / settings
        - AI panel / providers
        - Build / packaging
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      description: App version (or commit) and operating system
      placeholder: '1.0.0-bp.2 on Windows 11'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >
        What did you do, what did you expect, and what happened instead?
        If a document triggers the bug, attach a minimal sample file if
        possible (please remove anything confidential first).
      placeholder: Steps to reproduce, expected behavior, actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output, stack traces, or screenshots, if any.
